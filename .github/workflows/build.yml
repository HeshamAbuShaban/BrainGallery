name: Build BrainGallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=sdkmanager
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Report APK size breakdown
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "=== release APK: $(du -h "$APK" | cut -f1) ==="
          unzip -l "$APK" | awk 'NR>3 && NF>=4 {split($4,a,"/"); key=a[1]; if (a[1]=="lib" && NF>=5) key="lib/"a[2]; else if (a[1]=="assets") key="assets"; else if (a[1]=="res") key="res"; s[key]+=$1} END {for (k in s) printf "%10.2f MB  %s\n", s[k]/1048576, k}' | sort -rn | head -25
          echo "--- largest individual entries ---"
          unzip -l "$APK" | sort -rn | head -15

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-gallery-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-gallery-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=sdkmanager
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
