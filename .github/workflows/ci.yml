name: Android CI

# The repo's standing gate, on every push and pull request:
#   ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest
# Every run also ships the APK so a phone install is one download away.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: compile & test & apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.13+ requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the wrapper and dependencies, and validates the wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test, assemble (the standing gate)
        run: >
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug
          --stacktrace

      # Failing tests appear as annotations on the commit/PR, with file:line.
      - name: Unit-test annotations
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Unit tests
          report_paths: 'app/build/test-results/testDebugUnitTest/TEST-*.xml'

      - name: Ship the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # The HTML test report survives only if you know to ask for it.
      - name: Keep the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
